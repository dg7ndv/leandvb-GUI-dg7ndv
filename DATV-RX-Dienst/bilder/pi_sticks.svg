<text x="813" y="310" font-size="10.5" fill="#5b6573" font-weight="normal" text-anchor="middle">4 Sticks: Standard</text>
<rect x="1002" y="50" width="478" height="330" rx="12" fill="#fff" stroke="#1f7a3a" stroke-width="2"/>
<text x="1016" y="76" font-size="14" fill="#1f7a3a" font-weight="bold" text-anchor="start">Dienst auf dem Pi</text>
<text x="1016" y="104" font-size="12" fill="#1b1f24" font-weight="normal" text-anchor="start">• sucht &amp; dekodiert alle Signale</text>
<text x="1016" y="128" font-size="12" fill="#1b1f24" font-weight="normal" text-anchor="start">• Rufzeichen, MER, Pegel, Bitrate</text>
<text x="1016" y="152" font-size="12" fill="#1b1f24" font-weight="normal" text-anchor="start">• Autoverteiler: Signal → freier Stick</text>
<text x="1016" y="176" font-size="12" fill="#1b1f24" font-weight="normal" text-anchor="start">• Web-Interface :8554, JSON-API, MQTT</text>
<text x="1016" y="200" font-size="12" fill="#1b1f24" font-weight="normal" text-anchor="start">• je Stick ein UDP-Multicast-Strom</text>
<text x="1016" y="224" font-size="12" fill="#1b1f24" font-weight="normal" text-anchor="start">• Clients: MultiPlayer, leandvb-GUI, VLC</text>
<text x="20" y="440" font-size="12" fill="#5b6573" font-weight="normal" text-anchor="start">Je weiterer Stick eine eigene UDP-Adresse (Basisadresse + Stick-Nr.). Mit "Pi 5" ist Echtzeit-Empfang gemessen (Faktor 0,29 bei der Bake), Pi 4 ist zu langsam.</text>
